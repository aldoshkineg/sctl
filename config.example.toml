# sctl config (TOML)
#
# Copy to ~/.config/sctl/config.toml and edit.

[settings]
# Auto-unmount idle timeout applied to all secrets (e.g. "30s", "10m", "1h").
default_idle = "15m"
# Directory holding the gocryptfs backends (one subdir per secret).
enc_root = "~/.encrypted"
# Secret backend (REQUIRED): "tpm" or "escrow". Holds the shared gocryptfs
# password `G` (and any gpg_preset key passphrases). `sctl install` prompts for
# `G` once and seals it here; `mount` reads it back with zero prompts.
#   tpm    - seal secrets to this machine's TPM (unlock with no input).
#   escrow - decrypt secrets from `escrow_file` with the master passphrase.
secret_backend = "tpm"
# Recovery/portable copy (age/scrypt) wrapped by the master passphrase. Always
# written by `install`; it is the sole backend for `secret_backend = "escrow"`.
# Defaults to <config_dir>/sctl-escrow.age.
# escrow_file = "~/.config/sctl/sctl-escrow.age"
# Master passphrase source for the escrow copy: env SCTL_MASTER_PASS, then this
# file, then an interactive prompt. Emergency use only.
# master_passphrase_file = "~/.config/sctl/master.pass"

# --- Secrets ---------------------------------------------------------------
# Each [secrets.NAME] maps a cleartext mountpoint (path, relative to $HOME) to
# an encrypted backend at <enc_root>/NAME.

[secrets.ssh]
path = ".ssh"
# Backend-manage this ssh home: `install` enrolls every private key's
# passphrase into the secret backend (TPM or escrow), and `mount` preloads
# them into ssh-agent from the backend — so you are never prompted. Without
# `ssh_preset` these keys are left for ssh to prompt manually. At `sctl
# install` each key in this home is prompted for its passphrase; press Enter
# on an empty prompt to skip a key.
# ssh_preset = true

[secrets.gpg]
path = ".gnupg"
# gpg = true runs `gpgconf --kill all` around mount/unmount.
gpg = true
# Backend-manage this gpg home: `install` enrolls its key passphrases into the
# secret backend (TPM or escrow, selected by `secret_backend`), and `mount`
# preloads them into gpg-agent from the backend — so you are never prompted.
# Without `gpg_preset` this gpg home is not managed and gpg prompts manually.
# Requires `allow-preset-passphrase` in the volume's gpg-agent.conf.
# At `sctl install` each key in this home is prompted for its passphrase; press
# Enter on an empty prompt to skip a key (it is left out of the backend).
gpg_preset = true
# Force-unmount this secret if it stays `busy` (e.g. gpg-agent holds the
# mountpoint, or a shell has cwd inside it) longer than kill_busy_after.
# `sctl mount` forks a resident `sctl watch` daemon that polls every 60s and
# force-unmounts past the threshold. Defaults to 10m when omitted.
kill_busy = true
kill_busy_after = "10m"
# NOTE: gpg daemons (gpg-agent/keyboxd/scdaemon) are already killed by the
# `gpg = true` restart above, so listing them in auto_kill is redundant. Use
# auto_kill for *other* processes that may hold this mount busy (e.g. a shell
# or editor with cwd inside it).
# auto_kill = ["lf", "nnn"]

[secrets.pass]
path = ".password-store"
depends = ["gpg"]

[secrets.mail]
path = ".local/share/mail"
# Mounting mail auto-mounts its dependencies first (deps-first order).
depends = ["gpg", "pass"]
# Override the global idle timeout for this secret.
idle = "30m"
# File managers etc. that may be killed silently on a busy unmount.
auto_kill = ["lf", "nnn"]
# Optional lifecycle hooks (shell commands):
# pre_mount    = ["..."]
# post_mount   = ["..."]
# pre_unmount  = ["..."]
# post_unmount = ["..."]

# --- Idle resolution -------------------------------------------------------
# per-secret `idle` > env SCTL_IDLE > settings.default_idle > disabled.
# Use `sctl mount NAME --no-idle` to disable for a single mount.
