name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - target: x86_64-unknown-linux-musl
            name: linux-x86_64-static
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          dist="sctl-${{ github.ref_name }}-${{ matrix.name }}"
          install -Dm755 "target/${{ matrix.target }}/release/sctl" "$dist/sctl"
          install -Dm644 README.md "$dist/README.md"
          install -Dm644 LICENSE-MIT "$dist/LICENSE-MIT"
          install -Dm644 LICENSE-APACHE "$dist/LICENSE-APACHE"
          install -Dm644 config.example.toml "$dist/config.example.toml"
          tar -czf "$dist.tar.gz" "$dist"
          sha256sum "$dist.tar.gz" > "$dist.tar.gz.sha256"

      - name: Build release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          RANGE="${PREV:+${PREV}..}HEAD"
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          feat=$(git log --no-merges --pretty=format:'%s|%h' "$RANGE" | awk -F'|' 'tolower($1) ~ /^feat/ {print "- " $1 " (" $2 ")"}')
          fix=$(git log --no-merges --pretty=format:'%s|%h' "$RANGE" | awk -F'|' 'tolower($1) ~ /^fix/ {print "- " $1 " (" $2 ")"}')
          oth=$(git log --no-merges --pretty=format:'%s|%h' "$RANGE" | awk -F'|' 'tolower($1) !~ /^(feat|fix)/ {print "- " $1 " (" $2 ")"}')
          {
            echo "## What's Changed"
            echo
            [ -n "$feat" ] && { echo "### Features"; echo "$feat"; echo; }
            [ -n "$fix" ]  && { echo "### Fixes"; echo "$fix"; echo; }
            [ -n "$oth" ]  && { echo "### Other"; echo "$oth"; echo; }
            [ -n "$PREV" ] && echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV}...${TAG}"
          } > release-notes.md
          cat release-notes.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sctl-*.tar.gz
            sctl-*.tar.gz.sha256
          body_path: release-notes.md
