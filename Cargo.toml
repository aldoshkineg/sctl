[package]
name = "sctl"
version = "0.7.0"
edition = "2024"
rust-version = "1.89"
description = "Config-driven gocryptfs secret mount manager with dependencies, idle auto-unmount, and desktop notifications."
authors = ["Eugene Aldoshkin <aldoshkineg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aldoshkineg/sctl"
readme = "README.md"
keywords = ["gocryptfs", "encryption", "mount", "fuse", "cli"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/.github", "/legacy"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap_complete = "4.6.7"
nix = { version = "0.31.3", features = ["signal", "process", "user"] }
owo-colors = "4.3.0"
rpassword = "7.5.4"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.2"
zeroize = "1.8.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
